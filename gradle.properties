org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Baut die nativen llama.cpp-Bibliotheken mit. Verlangt ein installiertes Android-NDK und
# die Quellen unter core/inference/src/main/cpp/llama.cpp (siehe scripts/fetch-native-deps.sh).
# Ohne diesen Schalter baut die App normal; die lokale Inferenz meldet dann beim Start,
# dass die native Bibliothek fehlt.
neon.buildNative=false
