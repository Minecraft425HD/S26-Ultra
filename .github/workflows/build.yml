name: APK bauen

# Baut Neon und veröffentlicht die APK dort, wo sie sich vom Telefon aus installieren lässt.
#
# Der wichtigste Teil steht ganz unten: Bei jedem Push auf main wird der Release "latest"
# neu geschrieben. Dadurch gibt es genau einen dauerhaften Link, der immer die neueste
# Fassung liefert:
#
#   https://github.com/Minecraft425HD/S26-Ultra/releases/latest/download/neon.apk
#
# Im Handy-Browser antippen — Android bietet die Installation an. Kein Login, kein ZIP,
# kein Ablaufdatum. Ein Actions-Artefakt kann das alles nicht.

on:
  # Nur ein Auslöser, und der greift auf jedem Branch.
  #
  # Vorher liefen push UND pull_request gleichzeitig, sodass jeder Push auf einen
  # PR-Branch zweimal baute. Der Auslöser push auf main einzuschränken war der falsche
  # Ausweg: Ohne offenen PR baute ein Branch dann gar nichts mehr. Richtig ist,
  # pull_request wegzulassen — ein PR zeigt die Prüfung trotzdem an, weil sie auf
  # demselben Commit läuft.
  push:
  workflow_dispatch:

permissions:
  contents: write # zum Schreiben des Release

concurrency:
  # Überholte Läufe abbrechen. Bei mehreren Pushes kurz hintereinander interessiert nur
  # der letzte — und ein überholter Lauf könnte sonst einen älteren Stand veröffentlichen.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36 sicherstellen
        # Das Projekt baut gegen API 36. Ob das Runner-Abbild die gerade vorhält, ändert
        # sich mit jeder Aktualisierung — und AGP lädt fehlende Plattformen nicht von
        # selbst nach, sondern bricht ab.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nicht gefunden unter $SDKMANAGER"
            exit 1
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Tests
        # Der Integrationstest gegen einen echten llama-server überspringt sich hier
        # selbst — Server und Testmodell werden in CI nicht gebaut. Alles andere läuft.
        run: ./gradlew test testDebugUnitTest --stacktrace

      - name: Prüfen, dass llama-server mitgeliefert wird
        # Ohne diese Datei baut die APK zwar, kann aber keine Fragen beantworten. Ein
        # stiller Verlust wäre schwer zu bemerken — deshalb hier ausdrücklich prüfen.
        run: |
          BIN=app/src/main/jniLibs/arm64-v8a/libllama-server.so
          if [ ! -f "$BIN" ]; then
            echo "::error::$BIN fehlt. Mit scripts/build-llama-server.sh neu erzeugen."
            exit 1
          fi
          echo "gefunden: $(du -h "$BIN" | cut -f1)"
          file "$BIN" | grep -q "ARM aarch64" || {
            echo "::error::$BIN ist kein arm64-Programm."
            exit 1
          }

      - name: APK bauen
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Signatur prüfen
        # Der Punkt, an dem Updates hängen: Alle Fassungen müssen denselben Schlüssel
        # tragen, sonst verweigert Android die Installation über eine bestehende App —
        # und das importierte Sprachmodell wäre beim Neuaufsetzen verloren.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest"

      - name: APK als Artefakt hochladen
        # Für PR-Läufe, bei denen kein Release entsteht.
        uses: actions/upload-artifact@v4
        with:
          name: neon-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk neon.apk

          # Löschen und neu anlegen, damit die Marke auf den gebauten Stand zeigt. Der
          # Download-Link bleibt derselbe; er ist für wenige Sekunden nicht erreichbar.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest neon.apk \
            --target "$GITHUB_SHA" \
            --title "Neon — neueste Fassung" \
            --latest \
            --notes "Gebaut aus \`${GITHUB_SHA:0:8}\` am $(date -u '+%d.%m.%Y %H:%M') UTC.

          **Installieren:** Auf dem Telefon [neon.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/neon.apk) antippen.

          Updates lassen sich über eine bestehende Installation legen — das importierte Sprachmodell und das Gedächtnis bleiben erhalten."

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
