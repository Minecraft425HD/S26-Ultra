name: APK bauen

# Baut Neon und veröffentlicht die APK dort, wo sie sich vom Telefon aus installieren lässt.
#
# Der wichtigste Teil steht ganz unten: Bei jedem Push auf main wird der Release "latest"
# neu geschrieben. Dadurch gibt es genau einen dauerhaften Link, der immer die neueste
# Fassung liefert:
#
#   https://github.com/Minecraft425HD/S26-Ultra/releases/latest/download/neon.apk
#
# Im Handy-Browser antippen — Android bietet die Installation an. Kein Login, kein ZIP,
# kein Ablaufdatum. Ein Actions-Artefakt kann das alles nicht.

on:
  # Nur ein Auslöser, und der greift auf jedem Branch.
  #
  # Vorher liefen push UND pull_request gleichzeitig, sodass jeder Push auf einen
  # PR-Branch zweimal baute. Der Auslöser push auf main einzuschränken war der falsche
  # Ausweg: Ohne offenen PR baute ein Branch dann gar nichts mehr. Richtig ist,
  # pull_request wegzulassen — ein PR zeigt die Prüfung trotzdem an, weil sie auf
  # demselben Commit läuft.
  push:
  workflow_dispatch:

permissions:
  contents: write # zum Schreiben des Release

concurrency:
  # Überholte Läufe abbrechen. Bei mehreren Pushes kurz hintereinander interessiert nur
  # der letzte — und ein überholter Lauf könnte sonst einen älteren Stand veröffentlichen.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36 sicherstellen
        # Das Projekt baut gegen API 36. Ob das Runner-Abbild die gerade vorhält, ändert
        # sich mit jeder Aktualisierung — und AGP lädt fehlende Plattformen nicht von
        # selbst nach, sondern bricht ab.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nicht gefunden unter $SDKMANAGER"
            exit 1
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Tests
        # Der Integrationstest gegen einen echten llama-server überspringt sich hier
        # selbst — Server und Testmodell werden in CI nicht gebaut. Alles andere läuft.
        run: ./gradlew test testDebugUnitTest --stacktrace

      - name: Prüfen, dass llama-server mitgeliefert wird
        # Ohne diese Datei baut die APK zwar, kann aber keine Fragen beantworten. Ein
        # stiller Verlust wäre schwer zu bemerken — deshalb hier ausdrücklich prüfen.
        run: |
          BIN=app/src/main/jniLibs/arm64-v8a/libllama-server.so
          if [ ! -f "$BIN" ]; then
            echo "::error::$BIN fehlt. Mit scripts/build-llama-server.sh neu erzeugen."
            exit 1
          fi
          echo "gefunden: $(du -h "$BIN" | cut -f1)"
          file "$BIN" | grep -q "ARM aarch64" || {
            echo "::error::$BIN ist kein arm64-Programm."
            exit 1
          }

      - name: Android-Werkzeuge für das Telefon holen
        # aapt2 ist der Ressourcen-Compiler; ohne ihn kann Neon auf dem Telefon keine APK
        # bauen. Das Android SDK liefert ihn nur als x86-64-Linux-Programm, deshalb kommt
        # er samt Abhängigkeiten aus dem Termux-Depot — gegen festgenagelte Prüfsummen.
        #
        # Anders als llama-server liegen diese Dateien **nicht** im Repository: Sie sind
        # ein Download, kein Bauergebnis. Hier zu holen hält die Herkunft an einer
        # einzigen Stelle, nämlich den Prüfsummen im Skript.
        run: |
          sudo apt-get install -y patchelf
          ./scripts/fetch-android-tools.sh

      - name: Python-Umgebung für das Telefon holen
        # Offizielles CPython von python.org — seit 3.13 ist Android eine unterstützte
        # Plattform. Selbst zu bauen würde zwanzig Minuten je Runde kosten und dasselbe
        # ergeben, nur ohne Gegenzeichnung.
        run: ./scripts/fetch-python.sh

      - name: APK bauen
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 16-KB-Seitenausrichtung aller nativen Teile prüfen
        # Der Fehler, der Neon auf dem Zielgerät still unbrauchbar machte.
        #
        # Geräte, die mit Android 16 und mindestens 8 GB Arbeitsspeicher ausgeliefert
        # werden — das S26 Ultra gehört dazu —, arbeiten mit 16-KB-Speicherseiten. Der
        # Android-Linker weist jede ELF-Datei ab, deren LOAD-Segmente nur auf 4 KB
        # ausgerichtet sind: llama-server ließe sich nicht starten, die JNI-Brücke von
        # ONNX Runtime nicht laden. Auf dem Rechner fällt davon nichts auf, im Testlauf
        # auch nicht — nur auf dem Telefon, und dort nur als "tut nichts".
        #
        # Geprüft wird die fertige APK, nicht die Quellen: So ist jede mitgelieferte
        # Bibliothek erfasst, auch die aus künftigen Abhängigkeiten.
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          rm -rf /tmp/apk-libs && mkdir -p /tmp/apk-libs
          unzip -q -o "$APK" 'lib/arm64-v8a/*' -d /tmp/apk-libs

          # Die Ausrichtung steht in der letzten Spalte der LOAD-Zeilen, hexadezimal.
          # Umgerechnet wird in der Shell und nicht in awk: strtonum gibt es nur in gawk,
          # und welches awk ein Runner mitbringt, ist nicht verlässlich.
          schlechteste_ausrichtung() {
            readelf -lW "$1" \
              | awk '$1 == "LOAD" { print $NF }' \
              | while read -r WERT; do printf '%d\n' "$WERT"; done \
              | sort -n | head -1
          }

          FOUND=0
          FAILED=0
          for SO in /tmp/apk-libs/lib/arm64-v8a/*.so; do
            FOUND=$((FOUND + 1))
            WORST=$(schlechteste_ausrichtung "$SO")
            if [ -z "$WORST" ]; then
              echo "::error::$(basename "$SO") hat keine LOAD-Segmente."
              FAILED=$((FAILED + 1))
            elif [ "$WORST" -lt 16384 ]; then
              echo "::error::$(basename "$SO") ist auf $WORST Byte ausgerichtet, gebraucht werden 16384."
              FAILED=$((FAILED + 1))
            else
              echo "ok: $(basename "$SO") — $WORST Byte"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::Keine nativen Bibliotheken in $APK. Das kann nicht stimmen."
            exit 1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "$FOUND Bibliotheken geprüft, alle auf mindestens 16 KB ausgerichtet."

      - name: Rechenbefehle in llama-server prüfen
        # Derselbe Fehlertyp wie oben: unsichtbar auf dem Rechner, spürbar nur am Telefon.
        #
        # llama.cpp übersetzt ohne -DGGML_CPU_ARM_ARCH für `armv8-a`, den Grundbefehlssatz
        # von 2011. Die entstehende Datei ist gleich groß, startet einwandfrei und rechnet
        # richtig — sie rechnet nur quantisierte Matrizen in Schleifen aus
        # Einzelmultiplikationen statt mit einem Befehl je Schritt. Gemessen auf dem Gerät:
        # 0,71 Token je Sekunde statt der erwarteten 15 bis 25.
        #
        # Der Nachweis ist einfach: `sdot` muss vorkommen. Kommt es nicht vor, wurde ohne
        # den Schalter gebaut — meist, weil ein altes Bauverzeichnis stehengeblieben ist.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

          BIN=app/src/main/jniLibs/arm64-v8a/libllama-server.so
          SDOT=$(aarch64-linux-gnu-objdump -d --no-show-raw-insn "$BIN" \
            | grep -cE '[[:space:]](sdot|udot)[[:space:]]' || true)

          if [ "$SDOT" -eq 0 ]; then
            echo "::error::Kein sdot-Befehl in $BIN — ohne -DGGML_CPU_ARM_ARCH gebaut."
            echo "::error::Mit scripts/build-llama-server.sh neu erzeugen, Bauverzeichnis vorher löschen."
            exit 1
          fi
          echo "ok: $SDOT Skalarprodukt-Befehle in $(basename "$BIN")."

      - name: Signatur prüfen
        # Der Punkt, an dem Updates hängen: Alle Fassungen müssen denselben Schlüssel
        # tragen, sonst verweigert Android die Installation über eine bestehende App —
        # und das importierte Sprachmodell wäre beim Neuaufsetzen verloren.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest"

      - name: APK als Artefakt hochladen
        # Für PR-Läufe, bei denen kein Release entsteht.
        uses: actions/upload-artifact@v4
        with:
          name: neon-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk neon.apk

          # Löschen und neu anlegen, damit die Marke auf den gebauten Stand zeigt. Der
          # Download-Link bleibt derselbe; er ist für wenige Sekunden nicht erreichbar.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest neon.apk \
            --target "$GITHUB_SHA" \
            --title "Neon — neueste Fassung" \
            --latest \
            --notes "Gebaut aus \`${GITHUB_SHA:0:8}\` am $(date -u '+%d.%m.%Y %H:%M') UTC.

          **Installieren:** Auf dem Telefon [neon.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/neon.apk) antippen.

          Updates lassen sich über eine bestehende Installation legen — das importierte Sprachmodell und das Gedächtnis bleiben erhalten."

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
